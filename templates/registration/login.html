{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <h2 class="mb-3">Log in</h2>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button class="btn btn-primary">Log in</button>
    </form>
    <p class="mt-3">No account? <a href="{% url 'signup' %}">Sign up</a></p>
  </div>
</div>
{% endblock %}
